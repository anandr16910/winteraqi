name: AuraGuard CI / Test Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck Validation
        run: npm run typecheck

      - name: Execute Vitest Unit & Regression Tests
        run: npm run test:coverage
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-mock-key' }}

      - name: Build Production Bundle Validation
        run: npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-mock-key' }}
